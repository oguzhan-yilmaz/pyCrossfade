[build-system]
requires = ["setuptools>=50.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycrossfade"
version = "0.2.0"
description = "Create seamless beat-matched crossfade transitions between music files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oguzhan Yilmaz" }]
requires-python = ">=3.7"
# NOTE: madmom pins this project to the python 3.7 / debian buster era.
# Dependencies are intentionally not pinned here; install via requirements.txt
# inside the container to keep the frozen, working stack.
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.6.3",
    "typer>=0.14.0",
    "typing-extensions>=4.7.1",
    "pyrubberband>=0.4.0",
    "yodel>=0.3.0",
    "essentia>=2.1b6.dev374",
    "madmom>=0.16.1",
    "mido>=1.3.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pycrossfade = "pycrossfade.cli:main"

[tool.setuptools]
packages = ["pycrossfade"]
